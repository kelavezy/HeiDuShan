<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>守护好“中华水塔”</title>
  <!-- 引入外部资源 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">

  <!-- 水墨鎏金配色配置 -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gold: {
              light: '#f5e8c8',
              DEFAULT: '#d4af37',
              dark: '#b8860b'
            },
            ink: {
              light: '#666666',
              DEFAULT: '#333333',
              dark: '#1a1a1a'
            }
          },
        },
      }
    }
  </script>

  <style type="text/tailwindcss">
    @layer utilities {
      .scroll-indicator {
        animation: bounce 2s infinite;
      }
      @keyframes bounce {
        0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
        40% {transform: translateY(-10px);}
        60% {transform: translateY(-5px);}
      }
      .video-control-btn {
        background-color: rgba(0, 0, 0, 0.5);
        color: #d4af37;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
        cursor: pointer;
      }
      .video-control-btn:hover {
        background-color: rgba(0, 0, 0, 0.7);
        color: #f5e8c8;
      }
      .gold-gradient {
        background: linear-gradient(135deg, #1a1a1a 0%, #333333 50%, #1a1a1a 100%);
      }
      /* 超长竖屏图片样式：宽度满屏，高度自适应，完整展示不裁剪 */
      .long-vertical-img {
        width: 100%;
        height: auto;
        object-fit: contain;
        transition: transform 0.5s ease;
      }
      .long-vertical-img:hover {
        transform: scale(1.01); /* 悬停微放大，增强交互 */
      }
    }
  </style>
</head>

<body class="bg-ink-dark text-gray-100 font-sans overflow-x-hidden">
  <!-- 顶部导航栏（保留原样） -->
  <header class="gold-gradient shadow-md fixed w-full top-0 z-50 border-b border-gold/30">
    <div class="container mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center">
        <img src="image/logo.jpg" alt="校徽" class="w-12 h-12 rounded-full mr-3 object-cover border-2 border-gold/50">
        <h1 class="text-xl font-bold text-gold">独山玄览</h1>
      </div>
      <button class="text-gold text-xl focus:outline-none" id="menuBtn">
        <i class="fa fa-bars"></i>
      </button>
    </div>
  </header>

  <!-- 主内容区：保留大标题，正文仅放超长竖屏图片 -->
  <main class="pt-16 pb-12 overflow-y-auto">
    <section class="container mx-auto p-4">
      <!-- 大标题区域（保留原样） -->
      <div class="text-center mb-6 p-6 bg-ink/50 rounded-lg border border-gold/10">
        <h1 class="text-2xl font-bold text-gold mb-2">依法守护青藏高原生灵草木</h1>
        <p class="text-gray-400 text-sm">发布时间：2025年06月24日 | 来源：人民网</p>
      </div>

      <!-- 超长竖屏图片（核心正文区域，替换路径即可） -->
      <div class="rounded-lg overflow-hidden border-2 border-gold/20 shadow-xl">
        <!-- 替换为你的超长竖屏图片路径 -->
        <img src="image/slcm.jpg" alt="超长竖屏主题图" class="long-vertical-img">
      </div>
    </section>
  </main>

  <!-- 底部导航栏（保留原样） -->
  <footer class="fixed bottom-0 left-0 right-0 bg-ink-dark border-t border-gold/20 py-2 z-40">
    <div class="flex justify-around">
      <a href="index.html" class="flex flex-col items-center text-gold">
        <i class="fa fa-home text-lg"></i>
        <span class="text-xs mt-1">首页</span>
      </a>
      <a href="#" class="flex flex-col items-center text-gold">
        <i class="fa fa-newspaper-o text-lg"></i>
        <span class="text-xs mt-1">新闻</span>
      </a>
      <a href="#" class="flex flex-col items-center text-gray-400">
        <i class="fa fa-calendar text-lg"></i>
        <span class="text-xs mt-1">活动</span>
      </a>
      <a href="#" class="flex flex-col items-center text-gray-400">
        <i class="fa fa-info-circle text-lg"></i>
        <span class="text-xs mt-1">关于</span>
      </a>
    </div>
  </footer>

  <script>
    // 底部导航高亮当前页面（保留原样）
    document.addEventListener('DOMContentLoaded', () => {
      const newsNav = document.querySelectorAll('footer a')[1];
      newsNav.classList.remove('text-gray-400');
      newsNav.classList.add('text-gold');
    });
  </script>
</body>
</html>
